<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>訪校速查</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1b1e22;--ink2:#636c77;--line:#e3e1dc;
 --accent:#b4530a;--accent-bg:#fdf1e5;--phy:#0f6e6e;--phy-bg:#e6f2f2;--chip:#f0eeea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--panel:#1d2026;--ink:#e9e7e4;
 --ink2:#9aa1aa;--line:#2d3138;--accent:#e4914c;--accent-bg:#30231a;--phy:#56b8b8;--phy-bg:#15302f;--chip:#262a31}}
:root[data-theme=dark]{--bg:#14161a;--panel:#1d2026;--ink:#e9e7e4;--ink2:#9aa1aa;--line:#2d3138;
 --accent:#e4914c;--accent-bg:#30231a;--phy:#56b8b8;--phy-bg:#15302f;--chip:#262a31}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:580px;margin:0 auto;padding:0 16px 70px}
header{padding:16px 0 4px}
h1{font-size:19px;margin:0}
.meta{color:var(--ink2);font-size:13px;margin:3px 0 0}
.meta a{color:var(--accent);text-decoration:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:9px 0 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;font:inherit;font-size:14px;padding:6px 14px;border-radius:99px;
 border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg.sub button.on{background:var(--phy);border-color:var(--phy)}
.pane{display:none;padding-top:14px}.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:0 0 11px}
.card.phy{border-left:5px solid var(--phy)}
.nm{font-size:19px;font-weight:700;letter-spacing:1px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.role{font-size:11.5px;font-weight:600;letter-spacing:0;color:#fff;background:var(--accent);
 padding:2px 9px;border-radius:99px}
.kv{display:flex;gap:10px;margin:8px 0 0;font-size:14.5px}
.kv .k{flex:0 0 46px;color:var(--ink2);font-size:13px}.kv .v{flex:1}
.loc{margin-top:10px;padding:9px 11px;background:var(--phy-bg);border-radius:10px;font-size:14px;
 color:var(--phy);font-weight:600}
.loc small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:1px}
.tip{margin-top:9px;font-size:13.5px;color:var(--ink2);border-left:2px solid var(--line);padding-left:9px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.body{font-size:14px;color:var(--ink2);margin-top:8px;white-space:pre-wrap;line-height:1.72}
h2{font-size:15px;margin:20px 0 8px;color:var(--ink2);font-weight:600}
.room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.room h3{margin:0 0 2px;font-size:15.5px}
.room .h{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.blk{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rw{display:flex;gap:6px}
.dk{flex:1 1 0;min-width:0;background:var(--chip);border-radius:9px;padding:6px 4px;text-align:center;line-height:1.35}
.dk.e{background:transparent}
.dk .no{font-size:10.5px;color:var(--ink2);display:block}
.dk .n{font-weight:600;font-size:13.5px;letter-spacing:.5px;display:block}
.dk .s{font-size:11px;color:var(--ink2)}
.dk.hi{background:var(--phy);color:#fff}.dk.hi .no,.dk.hi .s{color:rgba(255,255,255,.85)}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px 13px;border-radius:11px;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:9px}
.row{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel);
 border:1px solid var(--line);border-radius:11px;margin-bottom:5px;font-size:15px}
.row b{letter-spacing:1px}.row .sj{font-size:12.5px;color:var(--ink2)}
.row .st{margin-left:auto;font-size:12px;color:var(--ink2);text-align:right;max-width:52%}
.row.hi{border-color:var(--phy);background:var(--phy-bg)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--ink2);font-weight:600;width:52px}
.note{font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px dashed var(--line);
 border-radius:11px;padding:10px 12px;margin-top:12px}
.vhd{font-size:13px;color:var(--ink2);margin-bottom:2px}
.vhd b{color:var(--ink);font-size:15px;letter-spacing:1px}
.tg{display:inline-block;font-size:11px;background:var(--accent-bg);color:var(--accent);
 padding:1px 7px;border-radius:5px;margin-left:5px}
.empty{color:var(--ink2);font-size:14px;padding:16px 2px}
.minimap{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 9px 1px}
.mmh{font-size:12.5px;color:var(--ink2);margin-bottom:7px;font-weight:600}
.mmh span{font-weight:400;margin-left:8px}
.dk.me{background:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.dk.me .no,.dk.me .s{color:rgba(255,255,255,.88)}
.dk.me .n::after{content:" ←";font-weight:700}
.loc.slim{font-weight:500;font-size:13px;padding:6px 11px}
.lg{font-size:11.5px;color:var(--ink2);margin:0 0 9px;display:flex;gap:12px;flex-wrap:wrap}
.lg i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.lg b{display:inline-block;width:11px;height:11px;border-radius:3px}
.planwrap{position:relative}
.plan{width:100%;height:auto;display:block;border-radius:9px;background:#fff;cursor:zoom-in}
.zb{position:absolute;right:7px;bottom:7px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;
 padding:2px 8px;border-radius:99px;pointer-events:none}
#lb{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.94)}
#lb.on{display:block}
.lbi{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
 display:flex;align-items:center;justify-content:flex-start;
 padding:calc(env(safe-area-inset-top,0px) + 50px) 0 calc(env(safe-area-inset-bottom,0px) + 12px)}
.lbi img{width:1100px;max-width:none;height:auto;background:#fff}
.lbx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:51;font:inherit;font-size:14px;padding:6px 14px;
 border-radius:99px;border:0;background:#fff;color:#111;font-weight:600;cursor:pointer}
.cap{font-size:11.5px;color:var(--ink2);margin:6px 0 8px;text-align:center}
.bks{display:flex;flex-direction:column;gap:4px}
.bk{display:block;font-size:13.5px;background:var(--chip);border-radius:7px;padding:3px 9px;
 border-left:3px solid var(--ink2)}
.bk.own{background:var(--phy-bg);border-left-color:var(--phy);color:var(--phy);font-weight:600}
.bk i{font-style:normal;color:var(--ink2);font-size:11.5px;margin-right:7px;font-weight:400}
.bk em{font-style:normal;display:block;font-size:11.5px;color:var(--ink2);font-weight:400;margin-left:30px}
.vcard{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);
 border-left:5px solid var(--ink2);border-radius:12px;padding:11px 13px;margin-bottom:9px}
.vcard.own{border-left-color:var(--phy)}
.vg{flex:0 0 38px;font-size:14px;color:var(--ink2);padding-top:1px}
.vb b{font-size:17px}
.vcard.own .vb b{color:var(--phy)}
.vb span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.vw{margin:6px 0 0;font-size:13px;color:var(--ink);letter-spacing:.5px}
.vw::before{content:"任教　";color:var(--ink2);font-size:11.5px;letter-spacing:0}
.minimap:has(.plan){padding:9px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="h1">訪校速查</h1>
  <p class="meta" id="meta"></p>
</header>
<div class="bar">
  <div class="seg" id="schoolSeg"></div>
  <div class="seg sub" id="tabSeg">
    <button data-p="p1" class="on">物理科</button>
    <button data-p="p2">座位</button>
    <button data-p="p3">用書</button>
    <button data-p="p4">找人</button>
    <button data-p="p5">紀錄</button>
  </div>
</div>
<div class="pane on" id="p1"></div>
<div class="pane" id="p2"></div>
<div class="pane" id="p3"></div>
<div class="pane" id="p4"></div>
<div class="pane" id="p5"></div>
</div>
<div id="lb" onclick="closeZoom(event)"><div class="lbi"><img id="lbimg" alt="放大的座位配置圖"></div>
<button class="lbx" onclick="closeZoom(event)">關閉 ✕</button></div>

: "鄭銘泉", "s": "化學", "c": "109.高一110./選1:物質與能量: 209.210"}, {"n": "陳怡宏", "s": "化學", "c": "301"}, {"n": "黃正良", "s": "化學", "c": "307~310"}, {"n": "徐培書", "s": "地科", "c": "101~105"}, {"n": "徐培書", "s": "地科", "c": "101~105"}], "visits": [{"d": "2023-06-19", "t": "鄭秀芬", "g": "#教科書", "by": "湯雅惠", "x": "1.老師教高一、高三，高一使用課本授課，高三使用講義授課。板書會截取教材畫面以小畫家軟體邊書寫投影內容授課，並將授課過程的板書圖檔存在雲端，供學生自由取用複習。\n\n2. [書:63004/選修物理II(全)力學二與熱學] 建議：覺得CH3-3力學能守恆：地表附近的重力位能的單元中，穿插了「非保守力」的相關說明(P104~P106)這樣的教學順序較為不順，認為較理想的教學順序為：保守力→力學能守恆→非保守力→力學能不守恆，即熟悉CH3-4、CH3-5之後再引入力學能不守恆狀態。\n\n3.司乃耳定律教法：老師目前是避開三角函數以比例方式說明，但認為若國中已學過三角函數，能在高一課本上再複習講清楚sin等函數的定義，輔助說明並無不可，例如文中描述邊長a/邊長b之值稱為sinθ之類的方式說明清楚即可，沒有一定要避免使用。\n\n4. [書:63001/物理(全)] \n\n課本內文建議：\n(1)教學順序：覺得物質的組成與交互作用應放在物體的運動之前，先了解交互作用再學習物體的運動，但是也有段考章節分割的困擾，調動後可能第二次段考的範圍切割也要再斟酌。\n(2)P112：「.....稱為司乃耳定律。」建議放在P113說明完定律實質內容的後面，即先理解內容，最後給予定義名詞，避免有先出現名詞，卻無法理解內容純粹記憶一個名詞的感覺。\n(3)P114：因受限於要以輔助圓說明，可能使內容看起來更加複雜難懂。\n\n課本圖片建議：\n(1)畫風穿插建議可以統一，如P63、P91等畫風覺得有點突兀，有向老師說明這類畫風統一出現在陳述科學史人物時繪製，老師認為可以不用刻意區隔出來，畢竟出現的頻率沒有很多，會顯得突兀。\n(2)底色較深或底圖過干擾：如P8(底圖干擾)、P44(底色使黑字不突顯)、P145(圖片太複雜、圖字不明顯)、P158(底色與軌道顏色過近)、P178(底色使圖片不突顯)，可能底色可以再淺一點。\n(3)有些重要的圖太小：P40(摩擦力與外力的關係圖)、P124(重點應在屏幕)、P127(原理說明)、P155(原理說明)\n(4)有些不重要的圖太大：P63(插畫)、P91(插畫)、P108(微波爐)、P112(水杯)、P123(蜂鳥)、P160~161(太陽、海洋的面積占比)。\n(5)其他細項：\nP34：下圖不好理解，應分成三個圖呈現。\nP61：圖3-3聲波空氣分子的呈現看不大出來是在表現疏密波；圖3-4燒紅的鐵殘影的呈現可以再調整。\nP77：強核力將受力箭頭畫出，感覺有正確性的問題。\nP108：原理說明的部分，較無法一眼明白各箭頭的涵義，建議加圖字讓圖片更明確。\nP116：照片無法看出離水面的位置差異，建議直接以兩張照片兩個視角拍攝輔以線段比較會比較清楚，另因畫面的切割，無法看出是一個在水缸中的杯子。\nP120：右方干涉說明圖，建議加上平衡位置的標示。\nP123：蜂鳥的照片無法使學生理解繞射現象是指哪裡。\nP128：光的都卜勒效應圖，建議加上頻率變化的輔助線標示。\nP188：建議光譜的線段顏色可以再明亮、再粗一點。\nP191：指引線的位置不大恰當，會以為2~3說明的內容是僅說明該指引線標示處。另，說明(1)中的講到的「左圖」不確定是指哪裡。"}], "note": "座位依「辦公室座位配置圖.pdf」（115學年度）重繪，任課與班級取自「115 萬芳高中.xls」。", "imgnote": "原圖來源：辦公室座位配置圖.pdf（115學年度）。圖中灰色弧形＝門，兩側灰色長條＝牆。橘框＝物理老師。"}, {"id": "songshan", "name": "松山高中", "short": "松山", "city": "台北市", "yr": "115", "addr": "台北市信義區基隆路一段156號", "tel": "02-2753-5968", "ver": [["高一", "翰林", ""], ["高二", "龍騰", "選1 力學一／選2 力學二與熱學"], ["高三", "龍騰", "選3 波動光及聲音"] 淑美", "x": "老師表示他是自編教材，因為出版社講義的布題跟他習慣不同，所以她習慣自己來。\n婉拒介紹，因為都下午2點了還沒吃飯。"}, {"d": "2025-05-05", "t": "周志平", "g": "#推廣回饋", "by": "陳淑美", "x": "老師準備退休，然後去馬來西亞台灣學校教書一年，給自己不同的體驗。\n他覺得繼續在松山教書也就是這樣，剛好有這個機會，想說本來就要退休，乾脆去幹一點不同的事。\n邊旅行邊教學，感受不同的文化。\n講到教材，老師說它們應該會換書，原因是他們已經連續用書兩年了！\n過去他們沒有連續用書的慣例，所以應該會換。趕緊提醒宸羽留意。\n\n另外，因為老師是全華總複習作者，有聽到他在跟新老師交流他的書，請新老師到新學校後可以幫他推廣。"}, {"d": "2025-05-05", "t": "詹明儒", "g": "#推廣回饋", "by": "陳淑美", "x": "老師雖然用講義上課，但備課時都會對照課本檢視過，確認哪些內容是課本範圍，哪些是講義自己的補充。\n即便是年輕老師，但老師仍是以板書上課，概念的部分自講，再搭配講義獎範例。\n\n介紹教材改版。"}, {"d": "2025-05-05", "t": "蔡皓偉", "g": "#推廣回饋", "by": "陳淑美", "x": "松山其實不在支援學校名單，但宸羽提到老師點名我們怎麼沒有編輯（企劃）來？同業都有。\n本來以為宸羽開玩笑，但今天皓偉老師一看到我就問：是誰叫你來的？業務嗎？\n\n之前觀過老師的課，他是一個根本不用出版社教材的老師，所以對教材如何根本不在意。\n今天到訪也主要是跟老師聊聊近況，以及關切像他這樣的老師，出版社可以做的幫忙是什麼？\n老師提到現在的教學跟20年前已經大為不同，以前根本無法想像數位化教學，現在卻已成常態。\n也因此跟老師介紹數位得來速，感覺在這部分他算是認同的。\n\n老師也分享他對AI的觀點，他認為要用AI直接產出可用的教案與題目，有點不切實際。\n但他覺得透過AI輔助「質性描述、提問」是還不錯的。\n因為AI計算常犯錯誤，但質性問題的互動倒是很有程度，\n所以讓學生透過AI去釐清自己對於某些定律、原理的概念是否清楚，是不錯的運用。\n\n老師也再分享他的研究方法課程，包含圖表分析等，我很感興趣，希望後續有機會約觀課。\n老師說他也不確定新學期教哪個年段，有機會的話觀課沒有問題。"}, {"d": "2024-05-02", "t": "呂志潔", "g": "#推廣回饋", "by": "陳淑美", "x": "通過宸羽的引薦，跟老師介紹高一改版。\n不過老師說他等下要上課，因此只能速戰速決。感受不出老師的喜好。"}, {"d": "2024-05-02", "t": "蔡皓偉", "g": "#修訂建議 #推廣回饋", "by": "陳淑美", "x": "老師隱約記得我，因為之前有去觀過他的課。\n跟老師簡單說明高一改版。\n提到我們跟同業最大的架構差異是CH2、3的順序時，老師認為那不是問題。\n因為老師們都可自行調整。\n聊到跨科題時，初始老師不是很認同高一就要講到跨科題。\n因為學生還沒學，採用那樣的題材只是徒增負擔。而如果只是考閱讀理解，那就不是大考的原意了!\n後來慢慢跟老師互動，其實跨科只是選材的差異，大方向來說都是素養題。\n而對於所跨的那科，基本上會盡量統合國中已學知識，再加入一點閱讀理解。\n但更大的比重與延伸，還是在我們物理本科上。\n老師聽到統合國中已學，就又比較認同。\n聊到目前用書狀況。\n因為我觀過老師的課，老師基本上是自編學習單，不用出版社教材。所以用哪個教材都沒差。\n請教老師目前用書的需求或問題等，老師表示題庫讓他很受不了。主要有以下兩點：\n(1)建議「節」之下要再設「知識點」。\n不然小節點開一堆題目，根本不知道從何選起。且系統還規定一次只能輸出200題還是300題。\n老師表示：我也不想要一次輸出這麼多題來挑啊！但你裡面就這麼多～\n(看來老師的用法比較傳統，會根據要測驗的小節輸出題庫題目來挑題)\n(2)難易度的區分不明確。\n我有跟老師說明，每個老師對於難易度的判斷不盡相同，所以確實我們也覺得有點為難。\n老師表示理解，但他印象有同樣的題目，出在選擇題分類為易；但出到填充題卻分類為難。\n難道是因為選擇題可以猜所以分為易嗎？這讓他覺得不太合理。\n跟老師說明如果這樣確實有點爭議，我們後續會再檢視。\n聊到後續共備社群這邊的觀課。老師有點驚訝原來他們的公開授課是有人在注意的。\n老師說他下週一就有探究實作的公開觀課，歡迎我們去。（但我下週一已有桃園行程，已告知老師）\n老師也說，確實觀探究實作，對我們教材的直接影響應該較小。\n但我也回饋老師，其實我觀過探究實作，也因為這樣的課程發現，原來老師們其實很看重「數據分析」的能力。\n老師表示，其實也不是老師們看重，而是過去沒有機會要求。\n所以確實在這波新課綱中，學生這塊的能力都有提升。\n因為以前就是做例行的實驗，不管誰做，基本上都得到相同的結果。"}, {"d": "2024-05-02", "t": "吳清源", "g": "#推廣回饋 #修訂建議", "by": "陳淑美", "x": "跟老師了解目前用書狀況。\n老師僅說好奇怪，他的書跟學生的書，頁數會不大一樣。\n釐清後發現，原來老師是Ｅ１版、學生是Ｆ版。\n但究竟老師為什麼會拿到Ｅ１版？因為我們同步翻隔壁老師（洪淑慧）的講義版次，也是Ｆ版啊！\n我說我請業務另外補給他～\n\n目前用書大致順暢，局部細節他們可自行調整。\n主動提出幾個小問題請教，老師都覺得目前這樣的安排很合適。\n比如提到他校老師會建議把「代數符號」的問題簡化為「數據」。因為學生看到代數符號就怕？\n但老師表示，他覺得這是高中應該要達到的能力。唯有保留代數符號，才看得出各物理量之間的關係。\n不然算出來答案3就是3，也看不出任何意義。\n至於請教「相對運動」的比重合適性，老師們表示他們是上完選2的質心後才回來上相對運動。\n目前來看也不覺得份量過重，是OK的。\n介紹高一改版。"}, {"d": "2022-04-11", "t": "吳清源", "g": "#用書意見", "by": "陳淑美", "x": "老師目前用龍騰高二，以課本、講義的範例為主，再適當補充習題。老師覺得龍騰教材優點是有針對新綱時數做題量調整，且有適當簡化題目，講義題目多數難易度合適且題量適中。老師表示多數版本題量掌控不佳，及試題呈現還是比較傳統舊題的方式，龍騰是目前版本中題目過濾的不錯的版本，只是局部還是有漏網之魚，可以再加以修正。（已紀錄）\n目前上課次序是按照新綱為主，但會因應局部內容做調整，比如角動量涉及到外積，而數學這部分的練習還不夠充分，所以會整體移到後面再上。老師表示因為目前時數少，沒有時間講太多的數學，所以必須等數學科把能力訓練起來再教。\n快速說明選2的架構調整，老師表示這樣確實有比較符合他們的授課習慣"}, {"d": "2022-04-11", "t": "洪淑慧", "g": "#用書意見", "by": "陳淑美", "x": "老師同樣也是目前使用我們高二，對教材的肯定度也是算高，只是在架構部分有自行做比較大幅度的調整，會先講選2的3-1、3-2，再回頭講動量守恆，但是會跳過角動量守恆，先帶能量與功的部分，再講到碰撞，然後接鉛直面的圓週運動、行星衛星的運動，最後才提到角動量守恆。呼應剛剛吳清源老師所說的角動量部分涉及到外積概念，會等數學能力上來再介紹，因此在結構上有做比較大的調整，跟洪老師說明我們選2的改版重點，算是有符合學校的調整。\n此外因為松山是前段學校，所以特別介紹滿分題本資源，老師雖然認為目前的題量已經算ok，但覺得有題本資源擴充也不錯。並跟老師介紹講義的習題進階題皆有影音解題，老師也是肯定。"}, {"d": "2022-04-11", "t": "周志平", "g": "#同業訊息", "by": "陳淑美", "x": "目前教高三，使用南一版本。\n老師表示因為沒有去檢視課綱到底刪除了什麼，但是目前教下來感覺刪了很多，還需要時間適應。跟老師簡單說明選3主要刪除反射、選5刪除惠斯同電橋。高三多數課程並未刪減，不過因為時數下修所以題型勢必得刪減。老師表示因為第一年教新綱高三，所以也還在摸索適應，雖然惠斯同刪了，但覺得題型是可以增補的。因此建議可以把課綱刪除的部分在補充題本補充，讓想上的老師找得到資源。（老師本來建議在課本補充，但在互動了今年度新增的滿分題本後，覺得可以把課綱刪除的一些資訊在題本補充。讓題本除了是擴充講義資源外，也作為課綱銜接的過度）\n不過老師自己也提到，第1~2年是老師們還在適應調整的時間，所以可能還會補充一些課綱刪除的資訊，但也許1~2年後適應了，就真的不補充了！就像當年康普吞效應刪除了，但前兩年老師們還是習慣補充，等幾年後確定真的不考了，老師們就會慢慢不上了。所以前兩年都是老師們的調適過程，可以先把課綱落差先補上提供給老師，再靜觀其變，之後也許真的可以刪乾淨。\n第一年的高二~三使用南一，覺得南一的教材不理想。\n本來學校科內是有自編教材的，但在新綱實施後，原本的自編教材內容太多了，但科內並沒有再去討論刪減，因此改用出版社教材上課。過去舊綱時，高二會以講義為主，高三因為有近代物理，會帶學生看課本敘述+講義範例來搭配。但新綱時數關係，高二試著改用課本上課，但因為使用南一，發現其課本有太多問題，比如敘述不恰當，且還有許多錯誤，因此高三還是改用講義，以講義的範例+習題為主。\n老師覺得新綱自然科的時數下修頗多，已經從原本的主科變成副科，老師們的教學型態也需要調整，不要再固守原本要教的內容，可以慢慢改成課本為主，因此建議課本習題的進階題也可做影音解題。（在介紹講義的習題進階題有影音解題後）\n老師非常讚許龍騰課本的編排，覺得美編太強了！！！\n老師預計最快明年退休，未來如有機會希望可以把多年的教學經驗整理，以主題式的方式把一些概念好好講清楚。可能是紙本形式，也可能是媒體形式。"}, {"d": "2022-04-06", "t": "曾家盈", "g": "#InfoCenter", "by": "劉碩儒", "x": "普高物理、技高物理B皆有任教，以板書＋自編教材上課。\n表示目前對龍騰版教材使用狀況都OK，沒有什麼問題。\n向老師分享科學偽證(3)，因為內含紅、藍膠片與線索卡，老師一看便表示大概知道要如何操作了，\n也向我詢問配量，我向老師說明一套可供一個班級使用（分六組），\n實際需求需再與郭老師討論，我也回覆請歐陽哥再向老師說明。\n對最速報、好學吧的介紹反應不錯，覺得可讓學生當Podcast聽很不錯！\n相對而言對「旅遊的科學」、「NETFLIX」就反應平平。"}, {"d": "2022-04-06", "t": "郭致輝", "g": "#InfoCenter #科任召集人", "by": "劉碩儒", "x": "使用課本PDF直接投影教學，介紹「物理最速報」時表現出高度興趣，也詢問檔案如何取得？\n我向老師說明我們除了置於教師用書PDF檔中，也在教學光碟與享備課中獨立成檔，\n如果老師要直接投影進行教學很方便。\n以平板介紹的過程中發生小插曲：\n老師看我以電子書開啟檔案連結，覺得很方便的樣子，\n詢問龍騰教科書的電子書目前是否也都有置入連結資源，\n我向老師說明因為是推廣用的資料，故有將常用檔案設定連結，\n物理電子書目前也有連結，但是以外部影片、教學補充資料的圖檔為主，\n也將訊息分享給歐陽哥，可再以物理電子書向老師操作、說明。\n對好學吧、旅遊的科學反應普普，僅聽過無特別反應。\nNETFLIX以影集長度較短、挑選好搭配段落時間點向老師訴求，\n老師表示會再參考內容是否適合於課堂播放。"}], "note": "座位僅「松山_任課與座位_115.xls / 座位表」分頁的物理科教師室，其餘物理老師該表未列。任課欄位為年段（V 記號），無班級明細。用書：龍騰只到選3，選4、選5 是南一（業務回報，原表只記「龍34」）。"}, {"id": "jingmei", "name": "景美女中", "short": "景女", "city": "台北市", "yr": "115", "addr": "臺北市文山區木新路三段312號", "tel": "02-2936-8847", "ver": [["高一", "翰林", ""], ["高二", "翰林", ""], ["高三", "龍騰", ""]], "phy": [{"n": "陳錦玫", "g": "", "c": "", "room": "自然科辦公室", "seat": "", "f": "科學館 2F", "e": "", "tip": "自然科召集人。板書派，教學影片對她意義不大。暑假複習用贈卷約6回、開學後複習卷約8回，會跳過 CH2、5。", "gs": ["高二"], "role": "自然科召集人"}, {"n": "游慈卉", "g": "", "c": "", "room": "教務處 設備組（仁愛樓一樓）", "seat": "", "f": "仁愛樓 1F", "e": "", "tip": "已調設備組任組長，座位在教務處、不在自然科辦公室。高一改用翰林無敵（嫌互動式太難）。最推翰林題庫可篩「知識點」。要以「章」為單位的小卷，重視全模／北模五標。", "gs": ["高三"], "role": "設備組長"}, {"n": "林瑞嬌", "g": "", "c": "", "room": "自然科辦公室", "seat": "", "f": "科學館 2F", "e": "", "tip": "肯定講義範例與份量，但建議刪掉過時題（如選5 P70 布拉格繞射計算）。小卷仍有需求（當課間考或回家作業）。", "gs": ["高二"]}, {"n": "張元儒", "g": "", "c": "", "room": "自然科辦公室", "seat": "", "f": "科學館 2F", "e": "", "tip": "高一課本+PPT、高二三講義+PPT。小卷全當作業、用 Google Classroom 公布答案。題庫會特意設出處。正在考慮雙語，已請業務接洽。" ""}, {"n": "游雲霞", "s": "生物", "c": ""}, {"n": "林鴻文", "s": "生物", "c": ""}, {"n": "譚懿文", "s": "生物", "c": ""}, {"n": "董詩芸", "s": "生物", "c": ""}, {"n": "何玉婷", "s": "地科", "c": ""}, {"n": "陳鈞嗣", "s": "地科", "c": ""}, {"n": "謝芮昕", "s": "地科", "c": ""}, {"n": "洪子茜", "s": "歷史", "c": ""}, {"n": "林湘乙", "s": "歷史", "c": ""}, {"n": "楊惠如", "s": "歷史", "c": ""}, {"n": "謝慧英", "s": "歷史", "c": ""}, {"n": "徐文晏", "s": "歷史", "c": ""}, {"n": "張國裕", "s": "歷史", "c": ""}, {"n": "吳孟蓉", "s": "地理", "c": ""}, {"n": "莊惠如", "s": "地理", "c": ""}, {"n": "石懷仁", "s": "地理", "c": ""}, {"n": "葉名森", "s": "地理", "c": ""}, {"n": "李敏慧", "s": "地理", "c": ""}, {"n": "李筱娟", "s": "地理", "c": ""}, {"n": "江信良", "s": "公民", "c": ""}, {"n": "林淑娟", "s": "公民", "c": ""}, {"n": "張良蕙", "s": "公民", "c": ""}, {"n": "宋幸蕙", "s": "公民", "c": ""}, {"n": "楊佳璇", "s": "公民", "c": ""}, {"n": "吳淑敏", "s": "公民", "c": ""}], "visits": [{"d": "2025-10-08", "t": "陳錦玫", "g": "#修訂建議", "by": "陳淑美", "x": "授課形式：\n以板書為主，即便應對高三下很趕的狀況，她仍是板書。\n但會取捨掉局部證明內容，僅是帶過概念。也因此對他來說，提供教學影片的意義不大。\n關於複習：\n暑假會用複習卷，大約6回左右，通常都是複習講義的贈卷。\n開學後會買複習卷，大概8回，剛好一路上複習到學測前。\n暑假複習會跳過CH2、5，因為高二力學剛上過；優先複習CH1、3、4、6。\n小卷使用：會使用小卷，段考前的複習回次就自己出。\n題庫使用：出處預設全選。"}, {"d": "2025-10-08", "t": "游慈卉", "g": "#修訂建議", "by": "陳淑美", "x": "目前用書狀況OK，第一次段考範圍是CH2~3\n因為學校程度關係，所以老師是以講義為主，再搭配滿分題本補充。\n由於該校並未提供滿分題本，所以老師是自行列印需要的回數。\n至於小卷的使用，因為沒那麼多時間，所以會希望有以「章」為單位的小卷。\n模擬卷：\n老師覺得模擬卷的品質非常重要，不是一般命題即可，所以他很重視歷屆全模、北模試題。\n老師認為模擬考題的重點不只在題目本身，還包括五標等資訊，\n重點在於學生練習完可以參考五標，了解自己的程度在哪裡。"}, {"d": "2025-10-08", "t": "廖思涵", "g": "#修訂建議", "by": "陳淑美", "x": "講義＋板書的授課形式，目前用書狀況OK。\n僅提及Change講義P88，授課會講類題，主要原因是類題材有帶到加速度，範例沒有。"}, {"d": "2025-10-08", "t": "張元儒", "g": "#修訂建議 #雙語教學", "by": "陳淑美", "x": "授課形式：\n高一會以「課本+PPT」、高二三會以「講義+PPT」。\n小卷使用：\n基本上沒時間考試，小卷都發給學生作為作業用，在googleclassroom布達答案。\n如果有不會的同學，也是請他在googleclassroom發文哪幾題不會，\n老師視狀況是簡單回文說明，還是課堂上再說明。\n基本上因為沒有時間，所以不在意複習回次。\n題庫使用：\n老師屬於會特意設定出處的人，不會預設全部。\n複習：\n暑輔複習以電與磁、近代物理為優先，\n基本上運動學會直接跳過去，因為已經磨了高二一整年。\n老師提問雙語資源，因為接下來這一年考慮取局部節數來操作雙語。\n基本上主要考慮學習單，但想參考雙語教材。已請業務進一步接洽。"}, {"d": "2025-10-08", "t": "林瑞嬌", "g": "#修訂建議", "by": "陳淑美", "x": "老師匆匆回來匆匆走，請教複習行為，僅表示會跳過力學及能量單元。因為高二剛磨過。"}, {"d": "2025-01-08", "t": "游慈卉", "g": "#修訂建議 #線上題測", "by": "陳淑美", "x": "目前教高一，用翰林無敵講義。\n老師表示互動式太難了，所以選擇無敵。不足的再自行補充。\n會搭配小卷、習作使用，他覺得在卷、習作與講義的對應性上，龍騰做的布錯。\n\n老師表示他用翰林下來，除了題庫的使用之外，覺得在其他品項上，沒有覺得龍騰做得不好，甚至覺得我們的對應性更好。\n但翰林的題庫真的太好用了，除了選到小節，還可以篩選知識點。\n翰林可以把同一個知識點的題目篩在一起，老師表示這點真的很方便。\n因為每次小考，老師其實會設定要考哪些知識點，不管題型(單、多、填等)為何，我只要有考到這個知識點即可。\n因此能夠以知識點來做題目篩選，對他來說很方便。\n了解老師在數位面的需求？\n老師表示目前教學以投影學用PDF，搭配教室大屏做講述。\n因此僅是需要PDF等電子檔，出版社幾乎都有滿足。\n\n問到像是解題影音或是數位類型資源？\n老師表示還好，他的學生比較認人，因此他講的學生會聽；但給他們別的老師的講解，學生不見得會聽。"}, {"d": "2024-10-11", "t": "董育甫", "g": "#修訂建議 #AI人工智能", "by": "陳淑美", "x": "可以說是為了老師來的，因為上次拜訪時老師很認真回饋意見，而今年他又教高二翰林版本，所以想來跟他了解用書狀況。\n老師表示，印象中龍騰講義品質也很好，只是選題偏簡單。今年用翰林，覺得題目難易度比較剛好。\n進一步跟老師了解，可否讓我知道翰林哪些挑題是他認為比較適中的?\n老師拿去年我們的講義與今年的翰林起來翻，結果是：第一次段考範圍其實差不多。\n只是像是平拋的「階梯型」、「軌跡方程式」等，翰林就有講，但我們沒有。\n（這個意見其實去年用我們時已經收過）\n\n老師表示，可能是在後面的章節才比較明顯，因為現在才剛用一個段考。\n他是有印象去年用龍騰用到後面，覺得重點整理他們講得口沫連天，但是卻沒有對應的試題可以練習；或是試題卻超簡單，對應不上重點。\n因此跟老師約定期末再次來跟老師了解，老師也同意。\n\n老師提到，除此之外，其實兩本講義的落差不大，題數也差不多，素養題也都有。\n請教老師對於這個世代的學生，會禁止他們用手機嗎？數位的部分有因此做什麼調整？\n老師其實心態很開放，表示他沒有限制學生用手機，而是教學生怎麼用。比如拿題目去問GPT，讓GPT教他解題。\n而且還可以讓GPT協助歸納出這道題的解題程序，甚至還可以要求GPT仿這道題出2題類似題來練習，並設計成引導式問答。\n而他自己是會透過GPT來改題目，有時候要自己從無到有出題很困難，讓GPT改，持續修正會簡單很多。\n老師覺得目前的GPT在回答高中課程問題，已經非常成熟。可以多加應用。\n（邀請新鮮試？老師表示現階段很忙，恐怕無法）\n因為學校下週段考，所以老師自己從題庫挑題出小卷要給學生回家練習。\n問出版社不是有提供小卷嗎？老師表示有，但不是他們的段考範圍，這是他自己針對這次段考範圍幫學生挑的。\n問到小卷題目的拿捏，老師認同對應講義的命題，讓學生有熟悉感，但不要全卷都是。\n還是可以有一點層次，比如５～６成改自講義，但其餘不是。"}, {"d": "2024-10-11", "t": "游慈卉", "g": "#修訂建議 #線上題測", "by": "陳淑美", "x": "老師今年教翰林高一，跟老師了解目前用書狀況，以及翰林的優缺點。\n老師以講義為主，表示其實講義的部分，翰林跟我們都差不多，他沒有特別的感覺。但是題庫就差異很大!\n\n翰林題庫的內容很完整，素養題很多、很新；且還有納入「模考題」。試題品質很讚！\n老師表示這是它們先天優勢（做模考），所以也不能怪我們。\n另外，素養題的部分，老師覺得翰林除了很多、很新之外，還包含得比較廣。\n比如，素養題不見得一定要是長題幹的試題，也可以是短短的單題，只是套情境。\n像這樣的題目，可以讓老師在命題上有比較大的彈性。因為一道題組很大，吃掉很多題數。\n因此他自己覺得，紙品的部分落差不大，但題庫差異比較大。"}, {"d": "2024-10-11", "t": "陳錦玫", "g": "#修訂建議", "by": "陳淑美", "x": "中午時間，可能因為下禮拜要段考了，所以有學生來找老師解題。\n學生很可愛，還問老師：「你可以解化學嗎？」。老師：「化學我只會解氣體方程式」...XD\n\n跟老師了解目前用書狀況（翰林高二）。\n老師表示，其實你們的書也很好，很適合我們學校。鄭呈因寫得很棒。（老師直接叫出作者名字）\n請教今年用翰林的狀況？老師說也還OK，它們今年真的改很多，這次段考教下來還算順，也教得完。"}, {"d": "2023-11-09", "t": "陳承昀", "g": "#修訂建議", "by": "陳淑美", "x": "年輕老師，以講義上課。目前任教高二，用龍騰選1。\n整體來說用書是順暢的，\n(1)不確定度：題目從1題A類、1題B類，再到1題組合，覺得漸進的很合適。\n老師表示這樣的程序符合他的脈絡，如果不這樣，他也會自己調整成這樣\n(2)相對運動：P72範例2稍微難一點，所以他們科內有共識不教。\n老師表示，景美的程度說高不高，所以他們同一年級的老師都會先共識，哪些題目不講，所以教學起來比較沒有壓力。\n相對運動對學生來說比較抽象，他上課也會看狀況，如果學生真的吸收不佳，會跟他們說，你們至少要會傳統方法就好。\n老師也說，其實「相對運動」對高中課程來說相對不重要，因為真的不會，對之後的學習影響並不大。\n(3)牛頓運動定律：老師是照著我們的順序教，也就是有講摩擦力跟例題（P111~P113）。\n老師提到，他們學校其實高一就已經補充摩擦力（靜、動），所以這裡帶到不是問題，也覺得先講是好的。\n(4)彈簧串並聯：目前就是照著我們教材走，教材沒寫就沒講，反正也講不完，所以沒想過要補充。"}, {"d": "2023-11-09", "t": "董育甫", "g": "#修訂建議", "by": "陳淑美", "x": "非常年輕的老師，不確定是代課還正式？但對教材有自己的想法（先姑且不論跟我們理解是否有落差），值得後續繼續留意。\n\n老師同時教高一、二，高一用翰林，高二用我們。因此順便請教高一翰林講義的情形。\n老師表示：\n(1)翰林高一講義很完整，所謂很完整是會帶到局部高二三的概念，但僅是點到為止不搶戲。\n此外，範例跟重點的扣合度很高，不過老師說，他的類題就不一定。他發現有些類題會跟範例沒搭上；且也會突然跳得很難。\n不然翰林在題量的拿捏上是蠻剛好的。\n(2)翰林題目很素養。\n老師認為高一的內容比較偏概念性，因此融入命程素養題是好的。\n且老師覺得翰林素養題融入得很好，不是那種把傳統題目硬套入一個情境框框中，但其實老師一看就知道他其實是以前哪種傳統題改的。\n翰林的素養題會讓他有「喔～這個應用是這樣啊！」的感覺。\n（翰林的課本就很假素養，看來講義的大改也包括素養重新命題～）\n\n跟老師互動素養題在教學上的適用性，會不會解釋題目要解釋很久。\n老師表示確實會這樣，有的一題就要花上10~15分鐘說明，不過也不到每題素養題都這樣。\n高二用書狀況：\n老師覺得我們有些範例有點太簡單，比如P113範例3、P129範例1等，感覺較為單點。\n（看吧！我就說我們範例1有被反應太簡單的，明倫老師根本沒看書啊~）\n老師表示他是屬於上比較多的，所以即便科內討論決定不教的題目，他還是都有教。\n但也覺得目前的份量在教學上很適中。"}, {"d": "2022-09-22", "t": "游慈卉", "g": "#分冊講義 #配套", "by": "陳淑美", "x": "游老師去年教我們高三，今年降下來教高二。覺得我們講義的重點整理、範例等內容、題量、難易度的拿捏都很OK，僅有建議分科測驗的題目可以再增加。老師也表示這部分題目的增加其實只是給學生自己練習，並不是他上課會講的，但覺得目前學生自己的練習量比較不足。以老師的使用來說，目前使用我們的講義很順暢，如果前面的範例沒有找到他要的，翻到後面的習題都找得到。老師很認同這樣的做法，表示範例太多反而會造成教學負擔。\n老師也很喜歡我們講義把後面習題分成基礎段考題、分科測驗進攻題，因為確實不是每個學生都要考分科，這樣的設計可以讓學生在做題時有所取捨，只想考學測但是當下面臨高二、高三段考的，只要做完第一部分即可。而很明白自己要考分科測驗的同學，就務必要做到第二部分。\n景美是高二上選物1、2，高三上選物3～5。跟老師了解小考或卷的狀況，老師表示三上還可以利用早自習考，但到了三下是完全沒有時間。老師目前的操作方式是，自己出課堂小小卷，運用課堂5～10分鐘小小考，通常請小老師上課鐘響就發，在他走到教室的這段時間寫，不過老師說他比較仁慈，大概會給10分鐘的時間寫完。小小卷只有僅有一1題題目，通常挑講義範例的類似題。有時候也會銜接上一次考試沒講完的題目。比如這道題目共有5小題，但最後1小題上課來不及講完，那同學小小卷只要寫前面4小題，而在同學利用5～10分鐘寫題目時，其實已經重新進入到這個題目中，這樣老師接著講最後1小題也會很順。\n老師喜歡我們之前的一些動畫，比如龍騰的光電效應，或者是康熹的克卜勒行星運動定律，但是因為Flash失效的關係，老師發現他的電腦顯示會錯位，導致有些按鈕按不到。老師建議這些舊動畫有些都很好，可以直接把它改成新軟體可以呈現即可。\n\n請教老師在電磁波偏振，教學上是否順暢？老師表示這裡確實是比較抽象內容，本來就比較不好講。而以考試的角度來說，這個在大考頂多出現1個選項，所以他覺得這邊就算沒有講清楚好像也還好。跟老師討論是否有什麼方式可以更具體表達？比如動畫？老師也贊同用動畫來呈現，設定幾個參數讓老師可以操作並看到現象。此外老師提到，這裡會讓老師們覺得不好講，最主要的原因是老師自己也不是很懂，如果可以請秀豪教授再來上課那就更棒了！也許可列為接下來龍騰講堂的主題。"}, {"d": "2022-09-22", "t": "林瑞嬌", "g": "#分冊講義 #產品缺口 #用書意見", "by": "陳淑美", "x": "請教用書狀況。老師認為我們講義的範例、難易度、份量等各方面都掌握得很好，教起來很順暢。僅表示有少數的題目感覺應該可以刪了，因為那都是很久以前的題目了！比如選5講義P70範例1是布拉格繞射的計算題，可是這類題型應該已經幾十年沒有考過了，是否還有存在的必要？雖然課綱有提及布拉格繞射，但著重點應該是概念的建構，而非計算，建議可以請作者思考。老師表示習題也有這種現象，建議我們可以整體斟酌。 [書:63207-R/【SUPER】選修物理V(全)電磁現象二與量子現象 教學講義 教師用本]\n請教小卷需求。\n在取消早自習後，幾乎沒有小考的時間，老師是否還有小卷需求？\n老師表示因為小考仍占學期成績計算的一部分比例，在徵詢學生意見後，應學生要求，仍保留小考成績。雖然真的沒有時間小考，但會把小卷發下去做課間考試（犧牲下課時間）或者回家作業，以此作為小考成績。所以對他來說，還是有小卷需求。\n至於是否有1～2題的課堂中小小卷需求，老師表示這部分很看老師個人到底想要講解哪一題，所以可交給老師自行處理即可，我們很難為其做判斷。"}, {"d": "2022-04-01", "t": "曾美婷", "g": "#用書意見", "by": "陳淑美", "x": "老師目前教高二，跟老師介紹靜力學改版。老師還蠻認同的，也覺得現在的版本拆得有點散，教起來很困擾。而因為老師也反映到時數不足問題，藉此帶到選修講義的影音解題，強調分科測驗進攻題，題題都有影音解題，老師相當肯定。\n因為景美是前段學校，特別跟老師介紹滿分題本，以及其中的段考交流區設計。老師覺得很不錯，問到是否會納入配套提供？此部分後續由達堅回覆。"}, {"d": "2022-04-01", "t": "陳錦玫", "g": "#修訂建議 #用書意見", "by": "陳淑美", "x": "老師目前教高二，不過因為是今年3月才回到學校，所以對於課綱異動、教材內容等，都還不是很熟悉。因為沒有上到上學期的牛頓運動定律，現在也還沒進到靜力平衡，所以老師並沒有覺得選修2的教學有哪裡不順，但有提到兩道講義題目似乎有超出範圍的問題，已記錄帶回。\n跟老師進一步討論，老師才驚覺天啊！原來他們現在還沒學過靜力平衡？！但是他課堂上已經一直在反覆提及合力為0的概念，但學生似乎也沒什麼異常反應。XD\n老師覺得現在的範例題量是勉強上的完的狀態，所以雖然感覺份量偏少，但也不宜再增加。整體用書觀感是正向的。"}], "note": "座位取自「景美_座位表_115.pdf」，任教年段取自「景美_自然科任課年段_115.png」（xlsx 的自然科分頁是空白模板）。業務回報更新：廖思涵已離職（原名單未更新，已從本頁移除）；游慈卉已調設備組任組長。葉港婷未出現在座位表上。"}, {"id": "banqiao", "name": "板橋高中", "short": "板橋", "city": "新北市", "yr": "115", "addr": "新北市板橋區文化路一段25號", "tel": "02-2960-2500", "ver": [["高一", "翰林", ""], ["高二", "三民", ""], ["高三", "龍騰", ""]], "phy": [{"n": "曾筱嵐", "gs": ["高三"], "g": "高三 3班", "c": "309.311.315", "role": "", "room": "科學館二樓 自然科教師室", "seat": "", "f": "科學館 2F", "e": "206、209", "tip": "自編講義（參考我們的教材整理）。反映題量偏少、選1 CH2 相對運動比重過高。謝如寧直言「掌握曾筱嵐即可」，是科內的意見領袖。"}, {"n": "黃筱嵐", "gs": ["高一", "高二"], "g": "高一 1班／高二 4班 1。\n跟詢問比較平衡因為覺得選務2台中然後選物一\n老師覺得我們講義不錯的地方是有一些難題，像是分科測驗的部分，有這樣的訓練是好的。也因此跟老師帶到，這些難題在111上都會做上解題影音。老師很有興趣，甚至想直接掃描，但因為現在選2還沒好，所以我拿書冊電子書點擊給老師看，老師還想開啟音量聽聽看，後來是以2倍速播放的方式快速瀏覽。老師回饋小因老師的3C功力應該很好，因為感覺這是很大的工程。也有追問是每一題嗎？再次跟老師說明：進階題的每一題都有。整體對於解題影音評價蠻高的。另外也介紹了滿分題本，雖然這位老師認為份量ok，但對滿分題本也是有表現出興趣，並且詢問在說明會會不會有書給他們參考？"}, {"d": "2022-03-30", "t": "茅崇德", "g": "#用書意見", "by": "陳淑美", "x": "老師相當資深，人非常的客氣、nice。使用出版社講義上課，但只是配合講義順序、挑範例來說明，但不會全部的範例都上。老師表示如果要全部上，一定上不完。所以他是如果出版社有5題，他大概只取3題來講，然後好好把這3題講得很仔細。所以大概就是，重點整理部分依照他自己理解這個概念的模式板書上課，再搭配局部出版社範例好好講清楚。用書上沒有什麼問題，僅是提到選物4、5的電流安排讓他有點不適應。由此帶到選物2靜力平衡的調整，說明這兩處其實都是這次課綱的重大異動。因為老師的上課份量有自行取捨過，所以他在每次的段考前都還有時間小考，會拿我們的小卷考試，操作的方式是直接抽課堂來做Open book的考試及檢討。比如段考前的範圍總共是4回小卷，他會抽出4節課來考試。所以對小卷有比較多意見，比如他認為高二回數比較少，應該至少要有15回才夠；高三因為有3冊，所以3冊的回數加起來是ok。可能因為Open book的關係，所以老師覺得難易度沒有問題，而採用Open book的原因是：其實考試不是重點，只是要逼學生學習。\n實驗部分：老師表示他們會按照段考切割來做實驗。因為他們段考是會考實驗的，基本上都會操作，就算沒有操作也會看過實驗影片。提到南一的實驗影片做得還不錯。跟老師說明我們的實驗也都有實驗影片，請老師也可以參考。\n跟老師介紹今年的解題影音，老師覺得如果在進階題每一題都有是蠻好的，但是也提到說其實他都有自己講。"}, {"d": "2022-03-30", "t": "謝如寧", "g": "#用書意見", "by": "陳淑美", "x": "之前拜訪都請我直接找別人，這次其實也是，特別指名曾筱嵐，但原來不是冷漠。\n老師看我等了兩節課，特地來關心我有沒有找到曾筱嵐老師，因為他覺得曾老師腦袋很清楚，會整理比較，且也願意分享，直接問他會得到比較完整的資訊。而他自己因為已經將近退休，所以已經沒有很仔細在比較版本。特地幫我查曾老師的課表，還告訴我可以拍照，還跟我致歉說讓我沒找到人。雖然沒得到教材上具體有用的資訊，但感覺得出來要掌握謝老師這一票，只要掌握曾老師即可。"}, {"d": "2021-10-20", "t": "李瑋舒", "g": "#用書意見", "by": "陳淑美", "x": "老師正在備課選物三。\n詢問老師關於教材面問題時，老師主動問到泰宇跟翰林還是有介紹光的反射，但是我們沒有。到底課綱是真的刪除了嗎？慎重跟老師說明，課綱在高一光的部分要粗略的講反射、折射、干涉、繞射等概念，但選修在光的反射並沒有要再往下延伸的內容，比如過去會延伸到面鏡的成像，現在已經都刪除了。但像是折射要延伸到司乃耳定律、透鏡的成像、全反射等；干涉、繞射要講到干涉、繞射條紋。的確課綱已經刪除了，會請業務把相關課綱資訊帶給老師。 [書:63005/選修物理III(全)波動、光及聲音]\n老師表示，我們搭贈的小試身手卷難易度只有一個標準，不適合所有的班級，比如資優班。目前高二小卷用起來比較偏簡單，但是高三好像還可以。\n詢問關於卷的題量問題，老師表示目前小卷的份量，他們確實可以用來考試，但是如果是大卷的話，通常他們是從裡面挑題來考並不會全卷寫。 [書:63005/選修物理III(全)波動、光及聲音]\n老師再問到水波槽裝置的問題，因為我們實驗手冊所用的水波槽是比較先進的設備，目前他們學校的設備比較老舊，設備上的差異會造成有些操作細節不同的問題。老師說他聽說只要有些學校的設備不一致，大考就不會考，真的嗎？這個部分需要再確認才能回覆。 [書:63005-E2/選修物理III 波動、光及聲音 實驗活動手冊]"}, {"d": "2021-10-20", "t": "謝如寧", "g": "#用書意見", "by": "陳淑美", "x": "老師表示我們很用心，整體來說除了題量偏少之外，沒有其他的問題。\n要我可以多問問曾筱嵐老師。 [書:63203/【SUPER】選修物理I(全)力學一 教學講義]"}, {"d": "2021-10-20", "t": "林天來", "g": "#用書意見", "by": "陳淑美", "x": "老師很資深，目前帶高一、高二、高三。高二三的部分，目前他們有加一節輔導課，所以以這樣的時數來上我們目前的講義是差不多的，剛好可以上的完。 [書:63203/【SUPER】選修物理I(全)力學一 教學講義]\n關於不確定度的部分，自己有重新整理過內容教學，教下來的感覺還可以。"}, {"d": "2021-10-20", "t": "蘇郁茜", "g": "#用書意見", "by": "陳淑美", "x": "老師覺得我們的優點就是把是否是課綱的內容分得很清楚，課綱沒有的我們就不出現，比如選3光的反射。不過老師覺得是不是可以有一個區塊放這樣的東西，讓想知道的人或想補充的老師可以做補充，不過老師說這是他個人見解。除此之外，因為老師也覺得我們的題量有些偏少，範例的部分有跟著變少，但還行，習題可以再多一些。 [書:63205/【SUPER】選修物理III(全)波動、光及聲音-教學講義]"}, {"d": "2021-10-20", "t": "曾筱嵐", "g": "#用書意見", "by": "陳淑美", "x": "老師主要是會參考我們的教材，然後整理成他的自編講義，所以並沒有實際拿我們的教材上刻，相對的感受就沒那麼深。\n但同樣有反應到題量的問題，覺得給學生的練習題好像稍微少了一點。\n此外老師提到在選物1的第二章，我們好像很強調相對運動。相較於其他節或其他版本，我們在相對運動的比例放得比較重，很多題目其實不見得要用相對運動來解，但我們都放在這邊。其實對學生來說相對運動比較難，所以來問的不少，建議相對運動的比例可以再做拿捏。 [書:63203/【SUPER】選修物理I(全)力學一 教學講義]"}], "note": "任課與版本取自「板橋_任課與版本_115.xls」，座位取自「板橋_全校座位圖_115.jpg」（115.08.28 正式版）。物理科 9 位中有 8 位在科學館二樓自然科教師室，陳福全是教務主任、在行政大樓。註：萬芳的蘇郁茜 2021 年還在板橋，資料庫那筆紀錄掛在板橋。"}];

  // --- 找人 ---
  document.getElementById('p4').innerHTML=
    '<input type="search" id="q" placeholder="姓名、科目、班級或座號…" autocomplete="off"><div id="list"></div>';
  document.getElementById('q').addEventListener('input',function(e){list(e.target.value)});
  list('');

  // --- 紀錄 ---
  h="";
  if(!s.visits.length) h='<div class="empty">這所學校還沒有訪談紀錄。</div>';
  s.visits.forEach(function(v){
    h+='<div class="card"><div class="vhd"><b>'+esc(v.t)+'</b><span class="tg">'+esc(v.g)+'</span><br>'+
       v.d+'　'+esc(v.by)+'</div><details><summary>展開全文</summary><div class="body">'+esc(v.x)+'</div></details></div>';
  });
  document.getElementById('p5').innerHTML=h;
}
function list(f){
  var s=SCHOOLS[S],phyNames=s.phy.map(function(p){return p.n}),h="";
  var seatOf={};
  s.rooms.forEach(function(r){r.b.forEach(function(b){b.forEach(function(row){row.forEach(function(c){
    if(c[1]) seatOf[c[1]]=(c[0]&&c[0]!=="專任"?c[0]+'　':'')+r.r;
  })})})});
  f=(f||"").trim();
  s.roster.forEach(function(p){
    var seat=seatOf[p.n]||"";
    if(f && (p.n+p.s+p.c+seat).indexOf(f)<0) return;
    h+='<div class="row'+(phyNames.indexOf(p.n)>=0?' hi':'')+'"><b>'+esc(p.n)+'</b>'+
       '<span class="sj">'+esc(p.s)+'</span><span class="st">'+esc(seat||p.c)+'</span></div>';
  });
  document.getElementById('list').innerHTML=h||'<div class="empty">找不到符合的老師</div>';
}
var seg=document.getElementById('schoolSeg');
SCHOOLS.forEach(function(s,i){
  var b=document.createElement('button');b.textContent=s.short;if(!i)b.className='on';
  b.onclick=function(){S=i;[].forEach.call(seg.children,function(x){x.className=''});b.className='on';
    render();showPane('p1');window.scrollTo(0,0);};
  seg.appendChild(b);
});
function showPane(id){
  [].forEach.call(document.querySelectorAll('#tabSeg button'),function(x){x.className=x.dataset.p===id?'on':''});
  [].forEach.call(document.querySelectorAll('.pane'),function(p){p.classList.toggle('on',p.id===id)});
}
[].forEach.call(document.querySelectorAll('#tabSeg button'),function(b){
  b.onclick=function(){showPane(b.dataset.p);window.scrollTo(0,0)};
});
function zoom(src){var l=document.getElementById('lb');
  document.getElementById('lbimg').src=src;l.classList.add('on');
  document.body.style.overflow='hidden';}
function closeZoom(e){if(e&&e.target&&e.target.tagName==='IMG')return;
  document.getElementById('lb').classList.remove('on');document.body.style.overflow='';}
render();
</script>
</body>
</html>
